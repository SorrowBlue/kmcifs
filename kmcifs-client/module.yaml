description: Kotlin Multiplatform SMB2/SMB3 client library

product:
  type: lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - macosArm64
    - linuxX64
    - linuxArm64
    - mingwX64

dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0
  - org.jetbrains.kotlinx:kotlinx-io-core:0.9.2: exported
  - io.ktor:ktor-network:3.4.0

test-dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  kotlin:
    optIns:
      - kotlin.ExperimentalUnsignedTypes
  android:
    namespace: com.sorrowblue.kmcifs.client
    minSdk: 26
  publishing:
    enabled: true
    group: com.sorrowblue.kmcifs
    version: 0.0.1
    artifactId: kmcifs-client
    publishSources: true
    signArtifacts: true
    mavenCentral:
      enabled: true
      publishingMode: manual
    pom:
      url: https://github.com/sorrowblue/kmcifs
      licenses:
        - name: The Apache Software License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
      developers:
        - id: sorrowblue
          name: SorrowBlue
          email: sorrowblue.dev@gmail.com
      scm:
        url: https://github.com/sorrowblue/kmcifs

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true
  - id: centralSnapshots
    url: https://central.sonatype.com/repository/maven-snapshots/
    publish: true
    resolve: false
    credentials:
      file: ../local.properties
      usernameKey: centralUsername
      passwordKey: centralPassword

plugins:
  dokka: enabled
