product:
  type: lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - macosArm64
    - linuxX64
    - linuxArm64
    - mingwX64

dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0
  - org.jetbrains.kotlinx:kotlinx-io-core:0.9.2: exported
  - io.ktor:ktor-network:3.4.0

test-dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  kotlin:
    optIns:
      - kotlin.ExperimentalUnsignedTypes
  android:
    namespace: com.sorrowblue.kmcifs.client
    minSdk: 26
  publishing:
    enabled: true
    group: com.sorrowblue.kmcifs
    version: 0.0.1
    artifactId: kmcifs-client
    publishSources: true

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true
