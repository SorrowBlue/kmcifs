name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-lock:
    name: Verify Actions Lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify-local

  test:
    name: Test (${{ matrix.name }})
    needs: verify-lock
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / JVM / Android
            os: ubuntu-latest
            cmd: ./kotlin test -m kmcifs-client -m sample -p jvm -p android -p linuxX64
          - name: Windows (mingwX64)
            os: windows-latest
            cmd: ./kotlin.bat test -m kmcifs-client -m sample -p mingwX64
          - name: macOS / iOS
            os: macos-latest
            cmd: ./kotlin test -m kmcifs-client -m sample -p macosArm64 -p iosSimulatorArm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Kotlin Toolchain
        uses: $/.github/actions/setup-kotlin

      - name: Run tests
        run: ${{ matrix.cmd }}

  build:
    name: Build (${{ matrix.name }})
    needs: verify-lock
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / JVM / Android / Windows
            os: ubuntu-latest
            cmd: ./kotlin build
          - name: macOS / iOS
            os: macos-latest
            cmd: ./kotlin build -m kmcifs-client -m sample -m macosApp -p macosArm64 -p iosArm64 -p iosSimulatorArm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Kotlin Toolchain
        uses: $/.github/actions/setup-kotlin

      - name: Build targets and sample apps
        run: ${{ matrix.cmd }}

  ci-success:
    name: CI Success
    needs: [verify-lock, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs succeeded
        run: |
          if [ "${{ needs.verify-lock.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed or were cancelled (verify-lock=${{ needs.verify-lock.result }}, test=${{ needs.test.result }}, build=${{ needs.build.result }})."
            exit 1
          fi

  publish-snapshot:
    name: Publish SNAPSHOT to Maven Central
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: snapshot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Kotlin Toolchain
        id: kotlin
        uses: $/.github/actions/setup-kotlin

      - name: Publish SNAPSHOT to Central Portal Snapshots
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SNAPSHOT_VERSION: ${{ steps.kotlin.outputs.snapshot_version }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "::notice::Skipping SNAPSHOT publication (${SNAPSHOT_VERSION}) because MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD secrets are not configured."
            exit 0
          fi

          sed -i.bak -E \
            -e "s/^( *version: *).*/\1${SNAPSHOT_VERSION}/" \
            -e "s/^( *signArtifacts: *).*/\1false/" \
            -e "/mavenCentral:/,/publishingMode:/ s/^( *enabled: *).*/\1false/" \
            kmcifs-client/module.yaml
          rm -f kmcifs-client/module.yaml.bak

          printf "centralUsername=%s\ncentralPassword=%s\n" "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" > local.properties
          ./kotlin publish centralSnapshots -m kmcifs-client

      - name: Clean up credentials file
        if: always()
        run: rm -f local.properties
