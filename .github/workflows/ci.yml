name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "true"

jobs:
  verify-lock:
    name: Verify Actions Lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify-local

      - name: Verify module.yaml version is not downgraded
        run: |
          VERSION=$(sed -nE 's/^ *version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' kmcifs-client/module.yaml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to parse version from kmcifs-client/module.yaml"
            exit 1
          fi

          LATEST_TAG_VERSION=$(git ls-remote --tags --refs origin "refs/tags/v[0-9]*.[0-9]*.[0-9]*" \
            | awk '{sub("refs/tags/v", "", $2); print $2}' \
            | sort -V \
            | tail -n 1)

          if [ -n "$LATEST_TAG_VERSION" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LATEST_TAG_VERSION" "$VERSION" | sort -V | tail -n 1)
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::Version '${VERSION}' in kmcifs-client/module.yaml is older than the latest released tag 'v${LATEST_TAG_VERSION}'."
              exit 1
            fi
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE_VERSION=$(git show "origin/${{ github.base_ref }}:kmcifs-client/module.yaml" 2>/dev/null \
              | sed -nE 's/^ *version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)
            if [ -n "$BASE_VERSION" ]; then
              HIGHEST=$(printf '%s\n%s\n' "$BASE_VERSION" "$VERSION" | sort -V | tail -n 1)
              if [ "$HIGHEST" != "$VERSION" ]; then
                echo "::error::Version '${VERSION}' in kmcifs-client/module.yaml cannot be downgraded from '${BASE_VERSION}' on '${{ github.base_ref }}'."
                exit 1
              fi
            fi
          fi

  linux:
    name: Linux (JVM / Android / Linux)
    needs: verify-lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Cache Kotlin Toolchain CLI
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/JetBrains/Kotlin/cli
          key: ${{ runner.os }}-kotlin-cli-${{ hashFiles('kotlin') }}

      - name: Cache Kotlin dependencies
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            !~/.cache/JetBrains/Kotlin/cli
            ~/.local/share/JetBrains/Kotlin
            ~/.m2/repository
          key: ${{ runner.os }}-kotlin-deps-${{ hashFiles('project.yaml', '**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-deps-

      - name: Run kmcifs-client tests (JVM, Android, linuxX64)
        run: |
          chmod +x ./kotlin
          ./kotlin test -m kmcifs-client -p jvm -p android -p linuxX64

      - name: Build linuxArm64 library and Linux/JVM samples
        run: |
          ./kotlin build -m kmcifs-client -p linuxArm64
          ./kotlin build -m jvmApp -m linuxApp

  windows:
    name: Windows (mingwX64)
    needs: verify-lock
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Cache Kotlin Toolchain CLI
        uses: actions/cache@v4.3.0
        with:
          path: ~/AppData/Local/JetBrains/Kotlin/cli
          key: ${{ runner.os }}-kotlin-cli-${{ hashFiles('kotlin.bat') }}

      - name: Cache Kotlin dependencies
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/AppData/Local/JetBrains/Kotlin
            !~/AppData/Local/JetBrains/Kotlin/cli
            ~/.m2/repository
          key: ${{ runner.os }}-kotlin-deps-${{ hashFiles('project.yaml', '**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-deps-

      - name: Run kmcifs-client tests (mingwX64)
        run: .\kotlin.bat test -m kmcifs-client -p mingwX64

      - name: Build Windows sample app
        run: .\kotlin.bat build -m windowsApp

  macos:
    name: macOS (Apple Silicon / iOS)
    needs: verify-lock
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Cache Kotlin Toolchain CLI
        uses: actions/cache@v4.3.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin/cli
          key: ${{ runner.os }}-kotlin-cli-${{ hashFiles('kotlin') }}

      - name: Cache Kotlin dependencies
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            !~/Library/Caches/JetBrains/Kotlin/cli
            ~/.m2/repository
          key: ${{ runner.os }}-kotlin-deps-${{ hashFiles('project.yaml', '**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-deps-

      - name: Run kmcifs-client tests (macosArm64, iosSimulatorArm64)
        run: |
          chmod +x ./kotlin
          ./kotlin test -m kmcifs-client -p macosArm64 -p iosSimulatorArm64

      - name: Build iosArm64 library and macOS sample app
        run: |
          ./kotlin build -m kmcifs-client -p iosArm64
          ./kotlin build -m macosApp

  publish-snapshot:
    name: Publish SNAPSHOT to Maven Central
    needs: [linux, windows, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Cache Kotlin Toolchain CLI
        uses: actions/cache@v4.3.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin/cli
          key: ${{ runner.os }}-kotlin-cli-${{ hashFiles('kotlin') }}

      - name: Cache Kotlin dependencies
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            !~/Library/Caches/JetBrains/Kotlin/cli
            ~/.m2/repository
          key: ${{ runner.os }}-kotlin-deps-${{ hashFiles('project.yaml', '**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-deps-

      - name: Publish SNAPSHOT to Central Portal Snapshots
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          CURRENT_VERSION=$(sed -nE 's/^ *version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' kmcifs-client/module.yaml | head -n 1)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Failed to parse version from kmcifs-client/module.yaml"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEXT_PATCH=$((PATCH + 1))
          SNAPSHOT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "Computed SNAPSHOT version: ${CURRENT_VERSION} -> ${SNAPSHOT_VERSION}"

          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "::notice::Skipping SNAPSHOT publication (${SNAPSHOT_VERSION}) because MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD secrets are not configured."
            exit 0
          fi

          sed -i.bak -E "s/^( *version: *).*/\1${SNAPSHOT_VERSION}/" kmcifs-client/module.yaml
          rm -f kmcifs-client/module.yaml.bak

          printf "centralUsername=%s\ncentralPassword=%s\n" "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" > local.properties
          chmod +x ./kotlin
          ./kotlin publish centralSnapshots -m kmcifs-client

      - name: Clean up credentials file
        if: always()
        run: rm -f local.properties
