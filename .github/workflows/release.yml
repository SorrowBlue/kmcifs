name: Release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/actions.lock"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build verification only without tagging or publishing a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "true"

jobs:
  prepare:
    name: Tag & Prepare Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Read version from module.yaml and determine release context
        id: meta
        run: |
          VERSION=$(sed -nE 's/^ *version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' kmcifs-client/module.yaml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to parse version from kmcifs-client/module.yaml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" != "true" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against existing tag and create Draft Release
        if: steps.meta.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' (from kmcifs-client/module.yaml version '${VERSION}') already exists. Please update 'version' in kmcifs-client/module.yaml before running Release."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$TAG' already exists."
            exit 1
          fi

          echo "Creating and pushing tag: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --generate-notes

  build-linux:
    name: Build Release Assets (Linux / JVM / Android)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.tag || github.ref }}

      - name: Cache Kotlin Toolchain CLI
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/JetBrains/Kotlin/cli
          key: ${{ runner.os }}-kotlin-cli-${{ hashFiles('kotlin') }}

      - name: Cache Kotlin dependencies
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            !~/.cache/JetBrains/Kotlin/cli
            ~/.local/share/JetBrains/Kotlin
            ~/.m2/repository
          key: ${{ runner.os }}-kotlin-deps-${{ hashFiles('project.yaml', '**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-deps-

      - name: Build release artifacts
        run: |
          chmod +x ./kotlin
          ./kotlin build -m kmcifs-client -p jvm -p android -p linuxX64 -p linuxArm64 -v release
          ./kotlin build -m linuxApp -v release
          mkdir -p dist
          tar -czf dist/kmcifs-linux-binaries.tar.gz -C build/tasks .

      - name: Attest build provenance
        if: needs.prepare.outputs.is_release == 'true'
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: "dist/*"

      - name: Upload assets to Draft Release
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  build-windows:
    name: Build Release Assets (Windows x64)
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.tag || github.ref }}

      - name: Cache Kotlin Toolchain CLI
        uses: actions/cache@v4.3.0
        with:
          path: ~/AppData/Local/JetBrains/Kotlin/cli
          key: ${{ runner.os }}-kotlin-cli-${{ hashFiles('kotlin.bat') }}

      - name: Cache Kotlin dependencies
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/AppData/Local/JetBrains/Kotlin
            !~/AppData/Local/JetBrains/Kotlin/cli
            ~/.m2/repository
          key: ${{ runner.os }}-kotlin-deps-${{ hashFiles('project.yaml', '**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-deps-

      - name: Build release artifacts
        run: |
          .\kotlin.bat build -m kmcifs-client -p mingwX64 -v release
          .\kotlin.bat build -m windowsApp -v release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\tasks\_windowsApp_linkMingwX64*\*.exe" -DestinationPath "dist\kmcifs-windowsApp-x64.zip" -Force

      - name: Attest build provenance
        if: needs.prepare.outputs.is_release == 'true'
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: "dist/*"

      - name: Upload assets to Draft Release
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$env:TAG" dist/* --clobber

  build-macos:
    name: Build Release Assets (macOS / iOS)
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.tag || github.ref }}

      - name: Cache Kotlin Toolchain CLI
        uses: actions/cache@v4.3.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin/cli
          key: ${{ runner.os }}-kotlin-cli-${{ hashFiles('kotlin') }}

      - name: Cache Kotlin dependencies
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            !~/Library/Caches/JetBrains/Kotlin/cli
            ~/.m2/repository
          key: ${{ runner.os }}-kotlin-deps-${{ hashFiles('project.yaml', '**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-deps-

      - name: Build release artifacts
        run: |
          chmod +x ./kotlin
          ./kotlin build -m kmcifs-client -p macosArm64 -p iosArm64 -p iosSimulatorArm64 -v release
          ./kotlin build -m macosApp -v release
          mkdir -p dist
          tar -czf dist/kmcifs-macos-binaries.tar.gz -C build/tasks .

      - name: Attest build provenance
        if: needs.prepare.outputs.is_release == 'true'
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: "dist/*"

      - name: Upload assets to Draft Release
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  publish-release:
    name: Publish Immutable Release
    needs: [prepare, build-linux, build-windows, build-macos]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Publish Draft Release (Lock as Immutable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false
          echo "Published immutable release: $TAG"
          gh workflow run docs.yml
