name: Release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/setup-kotlin/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/actions.lock"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build verification only without tagging or publishing a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Tag & Prepare Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      tag: ${{ steps.kotlin.outputs.tag }}
      version: ${{ steps.kotlin.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Read version metadata
        id: kotlin
        uses: $/.github/actions/setup-kotlin
        with:
          cache: "false"

      - name: Determine release context
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" != "true" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against existing or older version and create Draft Release
        if: steps.meta.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.kotlin.outputs.tag }}
          VERSION: ${{ steps.kotlin.outputs.version }}
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Releases can only be created from the 'main' branch (current ref: '${{ github.ref }}')."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' (from kmcifs-client/module.yaml version '${VERSION}') already exists. Please update 'version' in kmcifs-client/module.yaml before running Release."
            exit 1
          fi

          LATEST_VERSION=$(git ls-remote --tags --refs origin "refs/tags/v[0-9]*.[0-9]*.[0-9]*" \
            | awk '{sub("refs/tags/v", "", $2); print $2}' \
            | sort -V \
            | tail -n 1)

          if [ -n "$LATEST_VERSION" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -n 1)
            if [ "$VERSION" = "$LATEST_VERSION" ] || [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::Version '${VERSION}' in kmcifs-client/module.yaml must be newer than the latest released version 'v${LATEST_VERSION}'."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$TAG' already exists."
            exit 1
          fi

          echo "Creating and pushing tag: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --generate-notes

  build-assets:
    name: Build Release Assets (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux / JVM / Android
            os: ubuntu-latest
            build_cmd: |
              ./kotlin build -m kmcifs-client -p jvm -p android -p linuxX64 -p linuxArm64 -v release
              ./kotlin build -m linuxApp -v release
              mkdir -p dist
              tar -czf dist/kmcifs-linux-binaries.tar.gz -C build/tasks .
          - name: Windows x64
            os: windows-latest
            build_cmd: |
              ./kotlin.bat build -m kmcifs-client -p mingwX64 -v release
              ./kotlin.bat build -m windowsApp -v release
              mkdir -p dist
              tar -a -cf dist/kmcifs-windowsApp-x64.zip build/tasks/_windowsApp_linkMingwX64*/*.exe
          - name: macOS / iOS
            os: macos-latest
            build_cmd: |
              ./kotlin build -m kmcifs-client -p macosArm64 -p iosArm64 -p iosSimulatorArm64 -v release
              ./kotlin build -m macosApp -v release
              mkdir -p dist
              tar -czf dist/kmcifs-macos-binaries.tar.gz -C build/tasks .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.tag || github.ref }}

      - name: Set up Kotlin Toolchain
        uses: $/.github/actions/setup-kotlin

      - name: Build release artifacts
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Attest build provenance
        if: needs.prepare.outputs.is_release == 'true'
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: "dist/*"

      - name: Upload assets to Draft Release
        if: needs.prepare.outputs.is_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  publish-release:
    name: Publish Immutable Release
    needs: [prepare, build-assets]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Publish Draft Release (Lock as Immutable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false
          echo "Published immutable release: $TAG"
          gh workflow run docs.yml
