name: Release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/setup-kotlin/**"
      - ".github/release-drafter.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/actions.lock"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build verification only without tagging or publishing a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      is_prerelease: ${{ steps.kotlin.outputs.is_prerelease }}
      tag: ${{ steps.kotlin.outputs.tag }}
      version: ${{ steps.kotlin.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read version metadata
        id: kotlin
        uses: $/.github/actions/setup-kotlin
        with:
          cache: "false"

      - name: Determine release context
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" != "true" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against non-main branch, existing tag, or older version
        if: steps.meta.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.kotlin.outputs.tag }}
          VERSION: ${{ steps.kotlin.outputs.version }}
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Releases can only be created from the 'main' branch (current ref: '${{ github.ref }}')."
            exit 1
          fi

          if [ "${VERSION%%-*}" = "0.0.0" ]; then
            echo "::error::Version '${VERSION}' cannot be released. Please update 'version' in kmcifs-client/module.yaml (e.g. to '0.0.1') before running Release."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' (from kmcifs-client/module.yaml version '${VERSION}') already exists. Please update 'version' in kmcifs-client/module.yaml before running Release."
            exit 1
          fi

          LATEST_VERSION=$(git ls-remote --tags --refs origin "refs/tags/v[0-9]*.[0-9]*.[0-9]*" \
            | awk '{sub("refs/tags/v", "", $2); sub("-", "~", $2); print $2}' \
            | sort -V \
            | tail -n 1 \
            | tr '~' '-')

          if [ -n "$LATEST_VERSION" ]; then
            HIGHEST=$(printf '%s\n%s\n' "${LATEST_VERSION/-/\~}" "${VERSION/-/\~}" | sort -V | tail -n 1 | tr '~' '-')
            if [ "$VERSION" = "$LATEST_VERSION" ] || [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::Version '${VERSION}' in kmcifs-client/module.yaml must be newer than the latest released version 'v${LATEST_VERSION}'."
              exit 1
            fi
          fi

          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)" = "false" ]; then
            echo "::error::Published GitHub Release '$TAG' already exists."
            exit 1
          fi

  build-samples:
    name: Build Sample Executables (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux / JVM / Android
            artifact: samples-linux-jvm-android
            os: ubuntu-latest
            build_cmd: |
              ./kotlin build -m kmcifs-client -p jvm -p android -p linuxX64 -p linuxArm64 -v release
              ./kotlin package -m jvmApp -f executable-jar -v release
              ./kotlin build -m androidApp -v debug
              ./kotlin build -m linuxApp -v release
              mkdir -p dist
              cp build/tasks/_jvmApp_executableJarJvm/jvmApp-jvm-executable.jar dist/kmcifs-sample-jvm.jar
              cp build/tasks/_androidApp_buildAndroidDebug/gradle-project-debug.apk dist/kmcifs-sample-android.apk
              cp build/tasks/_linuxApp_linkLinuxX64Release/linuxApp.kexe dist/kmcifs-sample-linux-x64
              cp build/tasks/_linuxApp_linkLinuxArm64Release/linuxApp.kexe dist/kmcifs-sample-linux-arm64
          - name: Windows x64
            artifact: samples-windows
            os: windows-latest
            build_cmd: |
              ./kotlin.bat build -m kmcifs-client -p mingwX64 -v release
              ./kotlin.bat build -m windowsApp -v release
              New-Item -ItemType Directory -Force -Path dist | Out-Null
              Copy-Item build/tasks/_windowsApp_linkMingwX64Release/windowsApp.exe dist/kmcifs-sample-windows-x64.exe
          - name: macOS / iOS
            artifact: samples-macos
            os: macos-latest
            build_cmd: |
              ./kotlin build -m kmcifs-client -p macosArm64 -p iosArm64 -p iosSimulatorArm64 -v release
              ./kotlin build -m macosApp -v release
              mkdir -p dist
              cp build/tasks/_macosApp_linkMacosArm64Release/macosApp.kexe dist/kmcifs-sample-macos-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Kotlin Toolchain
        uses: $/.github/actions/setup-kotlin

      - name: Build release targets and sample executables
        run: ${{ matrix.build_cmd }}

      - name: Upload sample executables artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  prepare-release:
    name: Prepare Draft Release & Attest Provenance
    needs: [prepare, build-samples]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - name: Download sample executables
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: samples-*
          path: dist
          merge-multiple: true

      - name: Attest build provenance for sample executables
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/*"

      - name: Determine comparison baseline
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            LATEST_RELEASE=$(gh release list --exclude-drafts --limit 1)
          else
            LATEST_RELEASE=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1)
          fi
          if [ -z "$LATEST_RELEASE" ]; then
            echo "from=f3139f20318a93218532514618d551ae2e18d586" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
          fi

      - name: Update draft release with Release Drafter
        uses: release-drafter/release-drafter@v7.10.0
        with:
          config-name: release-drafter.yml
          version: ${{ needs.prepare.outputs.version }}
          tag: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          commitish: ${{ github.sha }}
          from: ${{ steps.baseline.outputs.from }}
          include-pre-releases: ${{ needs.prepare.outputs.is_prerelease }}
          publish: false

      - name: Upload sample executables to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  publish-maven:
    name: Publish to Maven Central
    needs: [prepare, prepare-release]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Kotlin Toolchain
        uses: $/.github/actions/setup-kotlin

      - name: Publish kmcifs-client to Maven Central
        env:
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: ./kotlin publish mavenCentral -m kmcifs-client

  publish-release:
    name: Publish GitHub Release & Deploy Docs
    needs: [prepare, prepare-release, publish-maven]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Publish immutable GitHub Release and trigger documentation deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --draft=false --prerelease --latest=false
            else
              gh release edit "$TAG" --draft=false --prerelease=false --latest
            fi
            echo "Published immutable release: $TAG (prerelease=$IS_PRERELEASE)"
          else
            echo "Release $TAG is already published; skipping publish step."
          fi

          if [ "$IS_PRERELEASE" != "true" ]; then
            gh workflow run docs.yml
          fi
