name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KOTLIN_CLI_NO_WELCOME_BANNER: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build Zensical documentation site
        run: uvx --python 3.13 zensical build --clean

      - name: Cache Kotlin Toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.local/share/JetBrains/Kotlin
            ~/.m2/repository
          key: ${{ runner.os }}-kotlin-dokka-${{ hashFiles('project.yaml', '**/module.yaml', 'kotlin') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-dokka-

      - name: Generate Dokka API reference
        run: |
          chmod +x ./kotlin
          ./kotlin do dokka
          mkdir -p build/site/api
          cp -r build/dokka/html/kmcifs-client/* build/site/api/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
