name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "zensical.ja.toml"
      - "plugins/dokka/**"
      - "kotlin"
      - "kotlin.bat"
      - "libs.versions.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "zensical.ja.toml"
      - "plugins/dokka/**"
      - "kotlin"
      - "kotlin.bat"
      - "libs.versions.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Documentation Changes
    runs-on: ubuntu-latest
    outputs:
      zensical: ${{ steps.decide.outputs.zensical }}
      dokka: ${{ steps.decide.outputs.dokka }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Filter changed paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            zensical:
              - 'docs/**'
              - 'zensical.toml'
              - 'zensical.ja.toml'
              - '.github/workflows/docs.yml'
            dokka:
              - 'plugins/dokka/**'
              - 'kotlin'
              - 'kotlin.bat'
              - '.github/workflows/docs.yml'

      - name: Determine jobs to run
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "zensical=true" >> "$GITHUB_OUTPUT"
            echo "dokka=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            DOKKA="${{ steps.filter.outputs.dokka }}"
            if [ "$DOKKA" != "true" ] && git diff HEAD^1 HEAD -- libs.versions.toml | grep -qE '^[+-][^+-].*dokka'; then
              DOKKA="true"
            fi
            echo "zensical=${{ steps.filter.outputs.zensical }}" >> "$GITHUB_OUTPUT"
            echo "dokka=${DOKKA}" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  zensical:
    name: Build Zensical Site
    needs: changes
    if: needs.changes.outputs.zensical == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Build Zensical documentation site
        run: |
          uvx --python 3.13 zensical build --strict --clean
          uvx --python 3.13 zensical build --strict --clean -f zensical.ja.toml

      - name: Upload Zensical artifact
        if: needs.changes.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: zensical-site
          path: build/site
          retention-days: 1

  dokka:
    name: Build Dokka API Reference
    needs: changes
    if: needs.changes.outputs.dokka == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Kotlin Toolchain
        uses: $/.github/actions/setup-kotlin

      - name: Generate Dokka API reference
        run: ./kotlin do dokka

      - name: Upload Dokka artifact
        if: needs.changes.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dokka-api
          path: build/dokka/html/kmcifs-client
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [changes, zensical, dokka]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Download Zensical site artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: zensical-site
          path: build/site

      - name: Download Dokka API artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dokka-api
          path: build/site/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
