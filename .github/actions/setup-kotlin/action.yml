name: "Set up Kotlin Toolchain"
description: "Configures Kotlin Toolchain CLI, permissions, version metadata, and dependency caches across Linux, macOS, and Windows."

inputs:
  cache:
    description: "Whether to restore and save Kotlin Toolchain and dependency caches"
    required: false
    default: "true"
  cache-read-only:
    description: "Whether to restore caches without saving new entries (defaults to true on pull_request)"
    required: false
    default: ""

outputs:
  version:
    description: "Current module version from kmcifs-client/module.yaml (e.g. 0.0.1 or 0.1.0-beta.1)"
    value: ${{ steps.meta.outputs.version }}
  tag:
    description: "Release tag corresponding to current version (e.g. v0.0.1 or v0.1.0-beta.1)"
    value: ${{ steps.meta.outputs.tag }}
  is_prerelease:
    description: "Whether the current version has a pre-release suffix (e.g. true for 0.1.0-beta.1)"
    value: ${{ steps.meta.outputs.is_prerelease }}
  snapshot_version:
    description: "Next SNAPSHOT version (e.g. 0.0.2-SNAPSHOT or 0.1.0-SNAPSHOT)"
    value: ${{ steps.meta.outputs.snapshot_version }}

runs:
  using: "composite"
  steps:
    - name: Configure environment, version metadata, and cache paths
      id: meta
      shell: bash
      env:
        INPUT_CACHE_READ_ONLY: ${{ inputs.cache-read-only }}
      run: |
        echo "KOTLIN_CLI_NO_WELCOME_BANNER=true" >> "$GITHUB_ENV"

        if [ -n "$INPUT_CACHE_READ_ONLY" ]; then
          CACHE_READ_ONLY="$INPUT_CACHE_READ_ONLY"
        elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          CACHE_READ_ONLY="true"
        else
          CACHE_READ_ONLY="false"
        fi
        echo "cache_read_only=${CACHE_READ_ONLY}" >> "$GITHUB_OUTPUT"

        if [ "$RUNNER_OS" != "Windows" ]; then
          chmod +x ./kotlin
        fi

        VERSION=$(sed -nE 's/^ *version: *([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?).*/\1/p' kmcifs-client/module.yaml | head -n 1)
        if [ -z "$VERSION" ]; then
          echo "::error::Failed to parse version from kmcifs-client/module.yaml"
          exit 1
        fi

        BASE_VERSION="${VERSION%%-*}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
        if [[ "$VERSION" == *-* ]]; then
          IS_PRERELEASE="true"
          SNAPSHOT_VERSION="${BASE_VERSION}-SNAPSHOT"
        else
          IS_PRERELEASE="false"
          NEXT_PATCH=$((PATCH + 1))
          SNAPSHOT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
        echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
        echo "snapshot_version=${SNAPSHOT_VERSION}" >> "$GITHUB_OUTPUT"

        mkdir -p ~/.konan

        case "$RUNNER_OS" in
          Linux)
            echo "cli_cache_path=~/.cache/JetBrains/Kotlin/cli" >> "$GITHUB_OUTPUT"
            {
              echo "toolchain_cache_path<<EOF"
              echo "~/.cache/JetBrains/Kotlin/download.cache"
              echo "~/.cache/JetBrains/Kotlin/extract.cache"
              echo "~/.konan"
              echo "~/.gradle/wrapper/dists"
              echo "EOF"
              echo "deps_cache_path<<EOF"
              echo "~/.cache/JetBrains/Kotlin/.m2.cache"
              echo "~/.cache/JetBrains/Kotlin/kotlin"
              echo "~/.gradle/caches/modules-*"
              echo "~/.gradle/caches/jars-*"
              echo "~/.gradle/caches/*/transforms"
              echo "~/.gradle/caches/*/generated-gradle-jars"
              echo "~/.gradle/caches/*/kotlin-dsl"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            ;;
          macOS)
            echo "cli_cache_path=~/Library/Caches/JetBrains/Kotlin/cli" >> "$GITHUB_OUTPUT"
            {
              echo "toolchain_cache_path<<EOF"
              echo "~/Library/Caches/JetBrains/Kotlin/download.cache"
              echo "~/Library/Caches/JetBrains/Kotlin/extract.cache"
              echo "~/.konan"
              echo "EOF"
              echo "deps_cache_path<<EOF"
              echo "~/Library/Caches/JetBrains/Kotlin/.m2.cache"
              echo "~/Library/Caches/JetBrains/Kotlin/kotlin"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            ;;
          Windows)
            echo "cli_cache_path=~/AppData/Local/JetBrains/Kotlin/cli" >> "$GITHUB_OUTPUT"
            {
              echo "toolchain_cache_path<<EOF"
              echo "~/AppData/Local/JetBrains/Kotlin/download.cache"
              echo "~/AppData/Local/JetBrains/Kotlin/extract.cache"
              echo "~/.konan"
              echo "EOF"
              echo "deps_cache_path<<EOF"
              echo "~/AppData/Local/JetBrains/Kotlin/.m2.cache"
              echo "~/AppData/Local/JetBrains/Kotlin/kotlin"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Cache Kotlin Toolchain CLI
      if: inputs.cache == 'true' && steps.meta.outputs.cache_read_only != 'true'
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.meta.outputs.cli_cache_path }}
        key: ${{ runner.os }}-kotlin-cli-${{ hashFiles('kotlin', 'kotlin.bat') }}

    - name: Restore Kotlin Toolchain CLI (read-only)
      if: inputs.cache == 'true' && steps.meta.outputs.cache_read_only == 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.meta.outputs.cli_cache_path }}
        key: ${{ runner.os }}-kotlin-cli-${{ hashFiles('kotlin', 'kotlin.bat') }}

    - name: Cache Kotlin Native and Gradle toolchains
      if: inputs.cache == 'true' && steps.meta.outputs.cache_read_only != 'true'
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.meta.outputs.toolchain_cache_path }}
        key: ${{ runner.os }}-kotlin-toolchains-v2-${{ hashFiles('kotlin', 'kotlin.bat') }}-${{ github.job }}

    - name: Restore Kotlin Native and Gradle toolchains (read-only)
      if: inputs.cache == 'true' && steps.meta.outputs.cache_read_only == 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.meta.outputs.toolchain_cache_path }}
        key: ${{ runner.os }}-kotlin-toolchains-v2-${{ hashFiles('kotlin', 'kotlin.bat') }}-${{ github.job }}
        restore-keys: |
          ${{ runner.os }}-kotlin-toolchains-v2-${{ hashFiles('kotlin', 'kotlin.bat') }}-build
          ${{ runner.os }}-kotlin-toolchains-v2-${{ hashFiles('kotlin', 'kotlin.bat') }}-

    - name: Cache Kotlin dependencies
      if: inputs.cache == 'true' && steps.meta.outputs.cache_read_only != 'true'
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.meta.outputs.deps_cache_path }}
        key: ${{ runner.os }}-kotlin-deps-v3-${{ github.job }}-${{ hashFiles('kotlin', 'kotlin.bat', 'libs.versions.toml') }}

    - name: Restore Kotlin dependencies (read-only)
      if: inputs.cache == 'true' && steps.meta.outputs.cache_read_only == 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.meta.outputs.deps_cache_path }}
        key: ${{ runner.os }}-kotlin-deps-v3-${{ github.job }}-${{ hashFiles('kotlin', 'kotlin.bat', 'libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-kotlin-deps-v3-${{ github.job }}-
          ${{ runner.os }}-kotlin-deps-v3-build-${{ hashFiles('kotlin', 'kotlin.bat', 'libs.versions.toml') }}
          ${{ runner.os }}-kotlin-deps-v3-build-
          ${{ runner.os }}-kotlin-deps-v3-
