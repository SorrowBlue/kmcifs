config:
  validation: true
  warningsAsErrors: false

complexity:
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 25
  LargeClass:
    active: true
    allowedLines: 1000
  LongMethod:
    active: true
    allowedLines: 120
  LongParameterList:
    active: true
    allowedFunctionParameters: 8
    allowedConstructorParameters: 10
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  NestedBlockDepth:
    active: true
    allowedDepth: 6
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
  InvalidPackageDeclaration:
    active: false

style:
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  NewLineAtEndOfFile:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  WildcardImport:
    active: false

ktlint:
  active: true
  code_style: 'intellij_idea'
  autoCorrect: false

Compose:
  active: true
